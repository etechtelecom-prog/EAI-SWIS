name: Feature request
description: Propose an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Operational problem
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed capability
    validations:
      required: true
  - type: textarea
    id: users
    attributes:
      label: Intended users and benefits
